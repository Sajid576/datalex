<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 20px Arial, sans-serif; fill: #334155; }
      .edge-label { font: 700 19px Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .small { font: 400 17px Arial, sans-serif; fill: #475569; }
      .box { stroke: #334155; stroke-width: 3; rx: 14; ry: 14; }
      .source { fill: #e0f2fe; }
      .collector { fill: #dcfce7; }
      .store { fill: #fef3c7; }
      .agent { fill: #ede9fe; }
      .retrieval { fill: #fce7f3; }
      .llm { fill: #e2e8f0; }
      .output { fill: #d1fae5; }
      .line { stroke: #1d4ed8; stroke-width: 7; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #ea580c; stroke-width: 7; stroke-dasharray: 18 12; marker-end: url(#arrowOrange); }
      .feedback { stroke: #15803d; marker-end: url(#arrowGreen); }
      .badge-db { fill: #92400e; stroke: #78350f; stroke-width: 1.5; rx: 8; ry: 8; }
      .badge-ai { fill: #6d28d9; stroke: #4c1d95; stroke-width: 1.5; rx: 8; ry: 8; }
      .badge-engine { fill: #be185d; stroke: #831843; stroke-width: 1.5; rx: 8; ry: 8; }
      .badge-text { font: 700 15px Arial, sans-serif; fill: #ffffff; letter-spacing: 0.5px; }
      .legend-text { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0" y="0" width="2200" height="1320" fill="#ffffff"/>
  <text x="1100" y="70" text-anchor="middle" class="title">Fig. 1. High-Level System Design of DataLex</text>
  <text x="1100" y="110" text-anchor="middle" class="subtitle">Offline agentic Graph-RAG SIEM reasoning with Suricata alert/normal routing, TOON compression, and sandbox-assisted zero-day triage</text>

  <!-- Legend -->
  <rect x="1510" y="122" width="95" height="30" class="badge-ai"/>
  <text x="1557.5" y="143" text-anchor="middle" class="badge-text">AI AGENT</text>
  <text x="1622" y="143" class="legend-text">reasoning or orchestration block</text>
  <rect x="1510" y="160" width="95" height="30" class="badge-db"/>
  <text x="1557.5" y="181" text-anchor="middle" class="badge-text">DATABASE</text>
  <text x="1622" y="181" class="legend-text">stored or indexed evidence</text>

  <!-- Input sources -->
  <rect x="70" y="190" width="300" height="110" class="box source"/>
  <text x="220" y="230" text-anchor="middle" class="box-title">Network Traffic</text>
  <text x="220" y="264" text-anchor="middle" class="box-text">Packets, flows, PCAP</text>

  <rect x="70" y="380" width="300" height="110" class="box source"/>
  <text x="220" y="420" text-anchor="middle" class="box-title">Endpoint Events</text>
  <text x="220" y="454" text-anchor="middle" class="box-text">Hosts, users, files</text>

  <rect x="70" y="570" width="300" height="130" class="box source"/>
  <text x="220" y="610" text-anchor="middle" class="box-title">Service Logs</text>
  <text x="220" y="644" text-anchor="middle" class="box-text">DNS, HTTP, TLS, apps</text>
  <text x="220" y="674" text-anchor="middle" class="box-text">firewall metadata</text>

  <!-- Collectors -->
  <rect x="500" y="190" width="310" height="110" class="box collector"/>
  <text x="655" y="230" text-anchor="middle" class="box-title">Suricata IDS</text>
  <text x="655" y="264" text-anchor="middle" class="box-text">EVE JSON generation</text>

  <rect x="500" y="380" width="310" height="110" class="box collector"/>
  <text x="655" y="420" text-anchor="middle" class="box-title">Wazuh Agents</text>
  <text x="655" y="454" text-anchor="middle" class="box-text">Endpoint telemetry</text>

  <rect x="500" y="570" width="310" height="130" class="box collector"/>
  <text x="655" y="610" text-anchor="middle" class="box-title">Filebeat / Logstash</text>
  <text x="655" y="644" text-anchor="middle" class="box-text">Shipping, parsing,</text>
  <text x="655" y="674" text-anchor="middle" class="box-text">normalization support</text>

  <!-- Stores and normalization -->
  <rect x="955" y="300" width="360" height="150" class="box store"/>
  <rect x="975" y="314" width="100" height="30" class="badge-db"/>
  <text x="1025" y="335" text-anchor="middle" class="badge-text">DATABASE</text>
  <text x="1135" y="374" text-anchor="middle" class="box-title">Raw Evidence Store</text>
  <text x="1135" y="406" text-anchor="middle" class="box-text">Original immutable JSON logs</text>
  <text x="1135" y="434" text-anchor="middle" class="small">Suricata, Wazuh, DNS, HTTP, TLS</text>

  <rect x="955" y="570" width="360" height="150" class="box store"/>
  <text x="1135" y="612" text-anchor="middle" class="box-title">Normalization and</text>
  <text x="1135" y="642" text-anchor="middle" class="box-title">Entity Extraction</text>
  <text x="1135" y="680" text-anchor="middle" class="box-text">IPs, users, ports, files,</text>
  <text x="1135" y="710" text-anchor="middle" class="box-text">hashes, signatures, time</text>

  <rect x="1490" y="170" width="330" height="120" class="box retrieval"/>
  <rect x="1510" y="188" width="100" height="30" class="badge-db"/>
  <text x="1560" y="209" text-anchor="middle" class="badge-text">DATABASE</text>
  <text x="1655" y="238" text-anchor="middle" class="box-title">Alert Log Partition</text>
  <text x="1655" y="270" text-anchor="middle" class="box-text">Suricata alert events</text>

  <rect x="1490" y="330" width="330" height="150" class="box retrieval"/>
  <rect x="1510" y="350" width="100" height="30" class="badge-db"/>
  <text x="1560" y="371" text-anchor="middle" class="badge-text">DATABASE</text>
  <text x="1655" y="405" text-anchor="middle" class="box-title">Normal Telemetry</text>
  <text x="1655" y="435" text-anchor="middle" class="box-title">Partition</text>
  <text x="1655" y="464" text-anchor="middle" class="box-text">Flow, DNS, HTTP, TLS,</text>
  <text x="1655" y="492" text-anchor="middle" class="box-text">fileinfo and netflow</text>

  <rect x="1490" y="550" width="330" height="170" class="box retrieval"/>
  <rect x="1510" y="568" width="115" height="30" class="badge-db"/>
  <text x="1567.5" y="589" text-anchor="middle" class="badge-text">GRAPH DB</text>
  <text x="1655" y="620" text-anchor="middle" class="box-title">Temporal Security Graph</text>
  <text x="1655" y="655" text-anchor="middle" class="box-text">Hosts, IPs, users, alerts,</text>
  <text x="1655" y="683" text-anchor="middle" class="box-text">files, ATT&amp;CK, sandbox</text>
  <text x="1655" y="711" text-anchor="middle" class="box-text">evidence and incidents</text>

  <!-- Query and agents -->
  <rect x="70" y="900" width="300" height="110" class="box source"/>
  <text x="220" y="940" text-anchor="middle" class="box-title">Analyst Query</text>
  <text x="220" y="974" text-anchor="middle" class="box-text">Natural language</text>

  <rect x="500" y="880" width="310" height="150" class="box agent"/>
  <rect x="520" y="902" width="95" height="30" class="badge-ai"/>
  <text x="567.5" y="923" text-anchor="middle" class="badge-text">AI AGENT</text>
  <text x="655" y="955" text-anchor="middle" class="box-title">Query-Intent Agent</text>
  <text x="655" y="990" text-anchor="middle" class="box-text">Alert, normal, mixed,</text>
  <text x="655" y="1018" text-anchor="middle" class="box-text">or sandbox route</text>

  <rect x="955" y="860" width="360" height="180" class="box retrieval"/>
  <rect x="975" y="882" width="118" height="30" class="badge-engine"/>
  <text x="1034" y="903" text-anchor="middle" class="badge-text">RETRIEVAL</text>
  <text x="1135" y="938" text-anchor="middle" class="box-title">Graph and Vector-less</text>
  <text x="1135" y="968" text-anchor="middle" class="box-title">Retrieval</text>
  <text x="1135" y="1000" text-anchor="middle" class="box-text">Exact filters + BM25</text>
  <text x="1135" y="1030" text-anchor="middle" class="box-text">+ temporal graph traversal</text>

  <rect x="1490" y="820" width="330" height="130" class="box agent"/>
  <rect x="1510" y="838" width="95" height="30" class="badge-ai"/>
  <text x="1557.5" y="859" text-anchor="middle" class="badge-text">AI AGENT</text>
  <text x="1655" y="890" text-anchor="middle" class="box-title">Sandbox Agent</text>
  <text x="1655" y="922" text-anchor="middle" class="box-text">Controlled execution</text>
  <text x="1655" y="946" text-anchor="middle" class="box-text">and behavior tracing</text>

  <rect x="1490" y="1040" width="330" height="130" class="box retrieval"/>
  <text x="1655" y="1082" text-anchor="middle" class="box-title">TOON Evidence</text>
  <text x="1655" y="1112" text-anchor="middle" class="box-title">Compressor</text>
  <text x="1655" y="1150" text-anchor="middle" class="box-text">Compact prompt bundle</text>

  <rect x="1880" y="805" width="280" height="160" class="box llm"/>
  <rect x="1898" y="825" width="95" height="30" class="badge-ai"/>
  <text x="1945.5" y="846" text-anchor="middle" class="badge-text">AI AGENT</text>
  <text x="2020" y="882" text-anchor="middle" class="box-title">Local LLM</text>
  <text x="2020" y="912" text-anchor="middle" class="box-title">Reasoning Agent</text>
  <text x="2020" y="942" text-anchor="middle" class="box-text">Offline forensic</text>
  <text x="2020" y="968" text-anchor="middle" class="box-text">analysis</text>

  <rect x="1880" y="1025" width="280" height="165" class="box llm"/>
  <rect x="1898" y="1045" width="95" height="30" class="badge-ai"/>
  <text x="1945.5" y="1066" text-anchor="middle" class="badge-text">AI AGENT</text>
  <text x="2020" y="1102" text-anchor="middle" class="box-title">Grounding and</text>
  <text x="2020" y="1132" text-anchor="middle" class="box-title">Hallucination Guard</text>
  <text x="2020" y="1162" text-anchor="middle" class="box-text">Claim-to-evidence</text>
  <text x="2020" y="1188" text-anchor="middle" class="box-text">verification</text>

  <rect x="955" y="1130" width="360" height="130" class="box output"/>
  <text x="1135" y="1172" text-anchor="middle" class="box-title">Explainable SIEM Answer</text>
  <text x="1135" y="1210" text-anchor="middle" class="box-text">Evidence IDs, severity,</text>
  <text x="1135" y="1240" text-anchor="middle" class="box-text">timeline, actions, confidence</text>

  <!-- Edges -->
  <path d="M 370 245 L 500 245" class="line"/>
  <path d="M 370 435 L 500 435" class="line"/>
  <path d="M 370 635 L 500 635" class="line"/>

  <path d="M 810 245 C 880 245 890 335 955 350" class="line"/>
  <path d="M 810 435 C 875 435 890 395 955 390" class="line"/>
  <path d="M 810 635 C 890 635 900 450 955 420" class="line"/>

  <path d="M 1135 450 L 1135 570" class="line"/>
  <path d="M 1315 630 L 1490 240" class="line"/>
  <text x="1386" y="390" class="edge-label">alert split</text>
  <path d="M 1315 645 L 1490 405" class="line"/>
  <text x="1388" y="535" class="edge-label">normal split</text>
  <path d="M 1315 665 L 1490 635" class="line"/>
  <text x="1388" y="645" class="edge-label">entities</text>

  <path d="M 370 955 L 500 955" class="line"/>
  <path d="M 810 925 C 1010 760 1280 280 1490 230" class="line dash"/>
  <text x="1035" y="720" class="edge-label">alert route</text>
  <path d="M 810 955 C 1010 820 1280 450 1490 405" class="line dash"/>
  <text x="1030" y="790" class="edge-label">normal route</text>
  <path d="M 810 985 C 1010 900 1280 665 1490 635" class="line dash"/>
  <text x="1030" y="865" class="edge-label">mixed route</text>
  <path d="M 810 1005 C 990 1045 1270 890 1490 885" class="line dash"/>
  <text x="1030" y="1035" class="edge-label">sandbox route</text>

  <path d="M 1490 230 C 1345 270 1220 670 1160 860" class="line"/>
  <path d="M 1490 405 C 1335 485 1215 720 1160 860" class="line"/>
  <path d="M 1490 635 C 1360 675 1235 790 1165 860" class="line"/>
  <path d="M 1490 885 L 1315 930" class="line"/>
  <path d="M 1655 950 L 1655 1040" class="line"/>
  <path d="M 1655 950 C 1700 990 1725 990 1750 950 C 1775 910 1725 730 1820 665" class="line feedback"/>

  <path d="M 1315 950 C 1410 950 1430 1105 1490 1105" class="line"/>
  <path d="M 1820 1105 L 1880 1095" class="line"/>
  <path d="M 1880 875 C 1805 900 1765 1025 1820 1095" class="line"/>
  <path d="M 2020 965 L 2020 1025" class="line feedback"/>
  <path d="M 1880 1095 C 1630 1245 1450 1210 1315 1195" class="line feedback"/>
</svg>
